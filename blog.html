<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dreammorph Blog</title>
  <style>
    body {
      font-family: sans-serif;
      max-width: 800px;
      margin: 40px auto;
      padding: 0 20px;
      background: #fff;
      color: #111;
      line-height: 1.7;
    }
    h1 { text-align: center; margin-bottom: 40px; }
    .post {
      border-bottom: 1px solid #ddd;
      margin-bottom: 30px;
      padding-bottom: 20px;
    }
    .post h2 { font-size: 1.4rem; margin-bottom: 10px; }
    .post p { color: #555; }
    a { color: #0073aa; text-decoration: none; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <h1>Dreammorph Blog</h1>
  <div id="posts">Loading posts...</div>

  <script>
    async function loadFeed() {
      // از سرویس rss2json برای رفع مشکل CORS استفاده می‌کنیم
      const rssUrl = encodeURIComponent("https://dreammorphblog.wordpress.com/feed/");
      const proxyUrl = "https://api.rss2json.com/v1/api.json?rss_url=" + rssUrl;

      try {
        const res = await fetch(proxyUrl);
        const data = await res.json();

        const container = document.getElementById("posts");
        container.innerHTML = "";

        data.items.slice(0, 5).forEach(item => {
          const post = document.createElement("div");
          post.className = "post";
          post.innerHTML = `
            <h2><a href="${item.link}" target="_blank">${item.title}</a></h2>
            <p>${item.description.replace(/<[^>]+>/g, "").substring(0, 200)}...</p>
            `
          ;
          container.appendChild(post);
        });
      } catch (err) {
        document.getElementById("posts").innerText = "Error loading blog feed ❌";
        console.error(err);
      }
    }

    loadFeed();
  </script>
</body>
</html>
