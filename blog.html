<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dreammorph Blog</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #ffffff;
            color: #111;
            text-align: center;
            padding: 40px;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 20px;
        }

        .post {
            max-width: 600px;
            margin: 20px auto;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 10px;
            text-align: left;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        .post h2 {
            font-size: 1.3rem;
            color: #333;
        }

        .post p {
            color: #555;
        }

        a {
            color: #0073aa;
            text-decoration: none;
        }
    </style>
</head>

<body>
    <h1>Dreammorph Blog</h1>
    <div id="blog-container">Loading posts...</div>

    <script>
        async function loadFeed() {
            const feedUrl = "https://api.allorigins.win/raw?url=https://dreammorphblog.wordpress.com/feed/";
            try {
                const res = await fetch(feedUrl);
                const text = await res.text();

                const parser = new DOMParser();
                const xml = parser.parseFromString(text, "text/xml");
                const items = xml.querySelectorAll("item");
                const container = document.getElementById("blog-container");
                container.innerHTML = "";

                items.forEach((item, index) => {
                    if (index < 5) {
                        const title = item.querySelector("title").textContent;
                        const link = item.querySelector("link").textContent;
                        const desc = item.querySelector("description").textContent;

                        const div = document.createElement("div");
                        div.classList.add("post");

                        container.appendChild(div);
                    }
                });
            } catch (err) {
                document.getElementById("blog-container").innerText = "Error loading blog feed ❌";
                console.error(err);
            }
        }

        loadFeed();
    </script>
</body>

</html>
