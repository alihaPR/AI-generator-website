<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dreammorph Blog</title>
  <style>
    body {
      font-family: sans-serif;
      max-width: 800px;
      margin: 40px auto;
      padding: 0 20px;
      background: #fff;
      color: #111;
      line-height: 1.7;
    }
    h1 {
      text-align: center;
      margin-bottom: 40px;
    }
    .post {
      border-bottom: 1px solid #ddd;
      margin-bottom: 30px;
      padding-bottom: 20px;
    }
    .post h2 {
      font-size: 1.4rem;
      margin-bottom: 10px;
    }
    .post p {
      color: #555;
    }
    a {
      color: #0073aa;
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <h1>Dreammorph Blog</h1>
  <div id="posts">Loading posts...</div>

  <script>
    async function loadFeed() {
      const url = "https://api.allorigins.win/raw?url=https://dreammorphblog.wordpress.com/feed/";
      try {
        const res = await fetch(url);
        const xmlText = await res.text();
        const parser = new DOMParser();
        const xml = parser.parseFromString(xmlText, "text/xml");
        const items = xml.querySelectorAll("item");

        const container = document.getElementById("posts");
        container.innerHTML = "";

        items.forEach((item, i) => {
          if (i < 5) { // فقط ۵ پست آخر
            const title = item.querySelector("title").textContent;
            const link = item.querySelector("link").textContent;
            const desc = item.querySelector("description").textContent
              .replace(/<[^>]+>/g, "")
              .substring(0, 200);

            const post = document.createElement("div");
            post.className = "post";
            post.innerHTML = `
            <h2><a href="${link}" target="_blank">${title}</a></h2>
            <p>${desc}...</p>
            `
            ;
            container.appendChild(post);
          }
        });
      } catch (err) {
        document.getElementById("posts").innerText = "Error loading blog feed.";
        console.error(err);
      }
    }

    loadFeed();
  </script>
</body>
</html>
